<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O Oráculo da Equipa · Corex</title>
<style>
:root{--navy:#06283d;--navy2:#0b3448;--cream:#f5eddb;--gold:#d6a24b;--teal:#17645f;--orange:#c75b38;--green:#47785d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at 50% 20%,#16475c 0,#06283d 48%,#031c2c 100%);color:var(--cream);overflow-x:hidden}
body:before{content:'✦   ☾   ✧   ✦   ☽   ✧   ✦';position:fixed;top:18px;left:0;right:0;text-align:center;color:#d6a24b66;font-size:22px;letter-spacing:12px;pointer-events:none}
.app{width:min(1000px,94vw);margin:auto;padding:55px 0 35px;text-align:center}.brand{font-family:Arial,sans-serif;font-weight:700;letter-spacing:2px;font-size:20px;margin-top:8px}.eyebrow{font:700 12px Arial,sans-serif;letter-spacing:4px;color:var(--gold);margin-top:25px}.title{font-size:clamp(42px,7vw,76px);line-height:.95;margin:8px 0;color:var(--cream);letter-spacing:3px}.subtitle{font-size:18px;max-width:600px;margin:18px auto 30px;line-height:1.5;color:#eadfc9}.panel{background:#f5eddb;color:#06283d;border-radius:22px;padding:34px;max-width:570px;margin:25px auto;box-shadow:0 20px 60px #0008;border:1px solid #d6a24b99}.panel h2{margin:0 0 18px;font-size:27px}.input{width:100%;padding:15px 17px;border:1px solid #b8a98e;border-radius:999px;background:#fffaf0;font-size:16px;color:#06283d;outline:none}.btn{margin-top:18px;border:0;border-radius:999px;padding:15px 27px;background:var(--navy);color:var(--cream);font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 20px #0003}.btn:hover{transform:translateY(-1px)}.hidden{display:none!important}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:32px auto;max-width:920px}.card{min-height:430px;background:var(--cream);color:var(--navy);border-radius:20px;padding:14px;box-shadow:0 18px 45px #0008;animation:rise .6s ease both}.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}.card-inner{height:100%;min-height:400px;border:2px solid var(--gold);border-radius:14px;padding:30px 22px;display:flex;flex-direction:column;justify-content:space-between}.symbol{font-size:42px;color:var(--gold)}.category{font:700 11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;border-radius:999px;padding:8px 12px;display:inline-block;margin:auto auto 16px}.message{font-size:23px;line-height:1.35;margin:0 0 18px}.card-title{font-size:28px;margin:8px 0 0}.footer{margin-top:25px;color:#d6a24bbb;font:12px Arial,sans-serif;letter-spacing:2px}.result-title{font-size:28px;margin:30px 0 5px}.result-name{color:var(--gold)}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@media(max-width:760px){.cards{grid-template-columns:1fr;max-width:420px}.card{min-height:360px}.card-inner{min-height:330px}.message{font-size:21px}}
</style>
</head>
<body>
<div class="app">
  <div class="brand">corex</div>
  <div id="start">
    <div class="eyebrow">ORÁCULO DA EQUIPA</div>
    <div class="title">3 CARTAS</div>
    <div class="subtitle">Três mensagens para refletir, decidir e construir uma equipa mais autónoma, consciente e forte.</div>
    <div class="panel">
      <h2>Qual é o teu nome?</h2>
      <input id="name" class="input" maxlength="60" placeholder="Escreve o teu nome..." autocomplete="off">
      <button class="btn" onclick="draw()">✦ Tirar as minhas cartas</button>
    </div>
  </div>
  <div id="result" class="hidden">
    <div class="eyebrow">AS TUAS CARTAS</div>
    <div class="result-title">Olá, <span id="person" class="result-name"></span> ✦</div>
    <div class="subtitle">A mensagem que saiu para ti hoje:</div>
    <div id="cards" class="cards"></div>
    <button class="btn" onclick="newDraw()">↻ Tirar 3 novas cartas</button>
  </div>
  <div class="footer">PENSAR · DECIDIR · PARTILHAR · APRENDER · CRESCER</div>
</div>
<script>
const cards=[
['A Análise','MENTE','🧠','Antes de perguntar, pensa. A resposta pode estar mais perto do que imaginas.','teal'],
['A Decisão','DECISÃO','🎯','Não precisas de ter 100% de certeza para começar a procurar uma solução.','orange'],
['A Confiança','DESENVOLVIMENTO','🌱','Hoje, confia um pouco mais no teu próprio critério.','green'],
['A Partilha','APRENDIZAGEM','💡','Se sabes fazer, explica. Se sabes explicar, ensina.','gold'],
['A Pergunta','COMUNICAÇÃO','💬','Não tragas apenas uma dúvida. Traz também uma hipótese.','teal'],
['O Critério','DECISÃO','⚖️','A solução mais rápida nem sempre é a que mais faz crescer a equipa.','orange'],
['O Erro','APRENDIZAGEM','↻','Errar é permitido. Repetir o mesmo erro sem aprender é opcional.','gold'],
['A Dúvida','MENTE','❓','Nem todas as dúvidas precisam de uma resposta. Algumas precisam de uma pergunta melhor.','teal'],
['A Autonomia','DESENVOLVIMENTO','🗝️','Autonomia começa quando deixamos de procurar imediatamente quem sabe.','green'],
['A Responsabilidade','DECISÃO','⚡','Se ninguém decidir, a decisão também já está a ser tomada.','orange'],
['O Desafio','DESENVOLVIMENTO','🚀','Hoje é um bom dia para resolver sozinho aquilo que ontem perguntaste.','green'],
['A Investigação','MENTE','🔍','Não confundas “não sei” com “ainda não procurei”.','teal'],
['A Ajuda','EQUIPA','🤝','Pedir ajuda não é falta de autonomia. Pedir ajuda sem antes pensar pode ser.','gold'],
['A Equipa','COLABORAÇÃO','🤝','Uma equipa forte não depende de uma pessoa. Aprende com ela.','gold'],
['A Orientação','LIDERANÇA','🧭','A pessoa mais experiente não tem de ter sempre a resposta.','green'],
['A Pergunta Certa','COMUNICAÇÃO','✦','Às vezes, a melhor ajuda é uma boa pergunta.','teal'],
['A Proposta','DECISÃO','🎯','Se tens uma proposta, estás mais perto da solução do que pensas.','orange'],
['A Voz','CONFIANÇA','🗣️','Não tenhas medo de dizer: “A minha análise é esta.”','green'],
['O Conhecimento','APRENDIZAGEM','📚','O conhecimento que fica apenas numa cabeça é um risco para a equipa.','gold'],
['A Partilha de Conhecimento','EQUIPA','🌱','Partilhar conhecimento hoje é criar autonomia para amanhã.','gold'],
['A Prioridade','DECISÃO','⏳','Nem tudo o que é urgente precisa de ser tratado por ti.','orange'],
['O Escalamento','DECISÃO','⬆️','Antes de escalar, pergunta-te: “O que já sei?”','orange'],
['O Processo','MENTE','⚙️','Se o processo existe, usa-o. Se não funciona, questiona-o.','teal'],
['O Hábito','DESENVOLVIMENTO','🔄','Não faças por hábito aquilo que já podes fazer por decisão.','green'],
['A Clareza','COMUNICAÇÃO','💬','Uma dúvida bem explicada já é metade do problema resolvido.','teal'],
['A Pequena Decisão','CONFIANÇA','🌱','A confiança também se constrói tomando pequenas decisões.','green'],
['O Porquê','MENTE','🔎','Não procures apenas a resposta. Procura perceber o porquê.','teal'],
['A Autonomia Coletiva','EQUIPA','✨','Uma equipa autónoma não é uma equipa que nunca pede ajuda. É uma equipa que sabe quando pedi-la.','gold'],
['O Futuro','DESENVOLVIMENTO','🌟','Hoje podes ser tu a pessoa que alguém procura amanhã.','green'],
['A Evolução','EQUIPA','🏗️','O verdadeiro sucesso é quando já não precisam de perguntar.','gold'],
['O Oráculo','HUMOR','🔮','Já consultaste o procedimento ou vieste diretamente consultar o oráculo?','orange'],
['Alerta','HUMOR','🚨','Estás prestes a perguntar algo que provavelmente sabes resolver.','orange'],
['A Dúvida','HUMOR','😄','Respira. Antes de perguntar, investiga primeiro.','gold'],
['O Teams','HUMOR','💻','Antes de escrever no Teams: pensa durante 30 segundos.','teal'],
['A Coragem','HUMOR','✨','Parabéns! Esta decisão é oficialmente tua.','green'],
['A Segunda-feira','HUMOR','☕','Não é uma emergência. É apenas mais uma segunda-feira.','orange']
];
const colors={teal:'#17645f',orange:'#c75b38',green:'#47785d',gold:'#b17b20'};
let lastName='';
function draw(){const input=document.getElementById('name');const name=input.value.trim();if(!name){input.focus();return}lastName=name;showDraw(name)}
function newDraw(){document.getElementById('result').classList.add('hidden');document.getElementById('start').classList.remove('hidden');document.getElementById('name').value='';document.getElementById('name').focus()}
function showDraw(name){
 document.getElementById('start').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('person').textContent=name;
 const pool=[...cards], chosen=[];while(chosen.length<3){chosen.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0])}
 document.getElementById('cards').innerHTML=chosen.map(c=>`<article class="card"><div class="card-inner" style="border-color:${colors[c[4]]}"><div><div class="symbol">${c[2]}</div><h2 class="card-title">${c[0]}</h2></div><div><div class="category" style="background:${colors[c[4]]};color:#fff">${c[1]}</div><p class="message">${c[3]}</p></div></div></article>`).join('');
 window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')draw()});
</script>
</body></html>
