function setLang(l){lang=l; document.documentElement.lang=l==='pt'?'pt-PT':l; const u=UI[l]; for(const [id,key] of [['eyebrow','eyebrow'],['title','title'],['subtitle','subtitle'],['nameLabel','nameLabel'],['drawBtn','draw'],['cardsEyebrow','cards'],['hello','hello'],['resultSubtitle','result'],['finalEyebrow','final'],['newBtn','newDraw'],['footer','footer']]) document.getElementById(id).textContent=u[key]; document.getElementById('name').placeholder=u.placeholder; if(!document.getElementById('result').classList.contains('hidden')) renderCards();}
